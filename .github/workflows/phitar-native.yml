name: PhiTar self-packaged desktop installers

on:
  pull_request:
    branches: [main]
    paths:
      - 'phitar.html'
      - 'src/PhiTar.jsx'
      - 'src/phitar*.js'
      - 'src/phitar*.jsx'
      - 'src/phitar*.css'
      - 'src/engine.js'
      - 'vite.config.js'
      - 'package.json'
      - 'scripts/phitar-self-package.mjs'
      - '.github/workflows/phitar-native.yml'
  push:
    branches: [main]
    paths:
      - 'phitar.html'
      - 'src/PhiTar.jsx'
      - 'src/phitar*.js'
      - 'src/phitar*.jsx'
      - 'src/phitar*.css'
      - 'src/engine.js'
      - 'vite.config.js'
      - 'scripts/phitar-self-package.mjs'
      - '.github/workflows/phitar-native.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge-kit:
    name: Forge PhiTar through Drop Zone
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Run engine and archive tests
        run: npm test
      - name: Compile standalone PhiTar web entry
        run: npm run build
      - name: Feed PhiTar into Drop Zone's generator
        run: node scripts/phitar-self-package.mjs
      - name: Upload self-generated native build kit
        uses: actions/upload-artifact@v4
        with:
          name: phitar-dropzone-self-kit
          path: |
            phitar-native-kit/
            phitar-build/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  native:
    name: PhiTar native / ${{ matrix.label }}
    needs: forge-kit
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
          - label: Linux
            os: ubuntu-22.04
          - label: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: phitar-dropzone-self-kit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install generated kit dependencies
        working-directory: phitar-native-kit
        run: npm install --no-audit --no-fund
      - name: Generate native app icons
        working-directory: phitar-native-kit
        run: npx tauri icon assets/icon.png
      - name: Compile unsigned PhiTar installers
        working-directory: phitar-native-kit
        run: npx tauri build
      - name: Upload compiled PhiTar desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phitar-${{ matrix.label }}-unsigned
          path: |
            phitar-native-kit/src-tauri/target/release/bundle/nsis/*.exe
            phitar-native-kit/src-tauri/target/release/bundle/msi/*.msi
            phitar-native-kit/src-tauri/target/release/bundle/deb/*.deb
            phitar-native-kit/src-tauri/target/release/bundle/appimage/*.AppImage
            phitar-native-kit/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 7
