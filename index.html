<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Drop Zone | Cross-platform Build Kits</title>
<style>
:root{--bg:#eceff3;--panel:#fff;--ink:#15202b;--mute:#566475;--line:#c9d1db;--acc:#0a6f6a;--on:#fff;--warn:#8a5200;--bad:#b3261e;--sh:#dde4eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--panel:#17212c;--ink:#e7ecf2;--mute:#91a0b2;--line:#2a3a4c;--acc:#3cc7bb;--on:#04201d;--warn:#e9b155;--bad:#ff8f86;--sh:#1f2c3a}}
:root[data-theme="dark"]{--bg:#0f1720;--panel:#17212c;--ink:#e7ecf2;--mute:#91a0b2;--line:#2a3a4c;--acc:#3cc7bb;--on:#04201d;--warn:#e9b155;--bad:#ff8f86;--sh:#1f2c3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:28px 16px 56px}
h1{font-size:2.1rem;line-height:1.1;margin:0 0 8px;letter-spacing:-.015em}
.sub{color:var(--mute);margin:0 0 24px;max-width:62ch}
.sr{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
.drop{display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;border:3px dashed var(--acc);border-radius:8px;padding:56px 18px;background:var(--panel);cursor:pointer;position:relative}
.drop strong{font-size:1.3rem}.drop span{color:var(--mute)}
.drop.on,.drop:focus-within{background:var(--sh);outline:2px solid var(--acc);outline-offset:3px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px;margin-top:18px}
.card h2{font-size:1.1rem;margin:0 0 4px}
.meta{color:var(--mute);margin:0 0 6px}
.warn{color:var(--warn);margin:6px 0 0}
.err{color:var(--bad);margin:14px 0 0;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:12px}
.f{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--mute)}
.in{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:8px 10px;width:100%;min-width:0}
.in:focus-visible,.go:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.f input[type=color]{padding:2px;height:38px;cursor:pointer}
fieldset{border:0;padding:0;margin:18px 0 0}
legend{font-weight:600;margin-bottom:8px;padding:0}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.chip{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;background:var(--bg)}
.chip.on{border-color:var(--acc);background:var(--sh)}
.chip:focus-within{outline:2px solid var(--acc);outline-offset:2px}
.chip small{color:var(--mute)}
.go{margin-top:18px;padding:12px 22px;font:inherit;font-weight:600;background:var(--acc);color:var(--on);border:0;border-radius:6px;cursor:pointer}
.go:disabled{opacity:.5;cursor:default}
.note{color:var(--mute);font-size:.92rem;margin:10px 0 0}
pre{overflow-x:auto;background:var(--bg);border:1px solid var(--line);padding:12px;border-radius:6px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;max-width:100%;margin:10px 0 0}
ol{padding-left:20px;margin:10px 0 0}li{margin:4px 0}
summary{cursor:pointer;margin-top:14px;font-weight:600}
</style></head>
<body><div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const {useState}=React,h=React.createElement;
const slug=s=>(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'app';
const semver=v=>/^\d+\.\d+\.\d+/.test(v||'');
const TG=[['pwa','Installable web app','PWA for any browser or phone'],['win','Windows','.exe installer'],['mac','macOS','.dmg'],['linux','Linux','.AppImage and .deb'],['android','Android','.apk'],['ios','iPhone and iPad','Unsigned Xcode archive']];
const KIND={vite:'Vite project',cra:'Create React App project',generic:'Node project with a build script',static:'Static site'};
const OS={win:'windows-latest',mac:'macos-latest',linux:'ubuntu-latest'};

const MAIN="const{app,BrowserWindow}=require('electron');\nconst path=require('path');\nfunction create(){\n  const w=new BrowserWindow({width:1280,height:820,autoHideMenuBar:true,webPreferences:{contextIsolation:true}});\n  w.loadFile(path.join(__dirname,'app','index.html'));\n}\napp.whenReady().then(create);\napp.on('window-all-closed',()=>{if(process.platform!=='darwin')app.quit()});\napp.on('activate',()=>{if(BrowserWindow.getAllWindows().length===0)create()});\n";
const SW="const C='app-cache';\nself.addEventListener('install',()=>self.skipWaiting());\nself.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));\nself.addEventListener('fetch',e=>{\n  if(e.request.method!=='GET')return;\n  e.respondWith(fetch(e.request).then(r=>{const c=r.clone();caches.open(C).then(k=>k.put(e.request,c));return r}).catch(()=>caches.match(e.request)));\n});\n";

async function readProject(f){
  const n=f.name,base=n.replace(/\.[^.]+$/,'').replace(/[-_](main|master)$/,''),warns=[];
  let z,pre='',pkg=null,kind,count=1;
  if(/\.zip$/i.test(n)){
    z=await JSZip.loadAsync(f);
    const ns=Object.keys(z.files).filter(k=>!z.files[k].dir&&!/^__MACOSX|(^|\/)\.DS_Store$/.test(k));
    count=ns.length;
    const tops=new Set(ns.map(k=>k.split('/')[0]));
    if(tops.size===1&&ns.every(k=>k.includes('/')))pre=[...tops][0]+'/';
    const pj=z.file(pre+'package.json');
    if(pj){
      pkg=JSON.parse(await pj.async('string'));
      const d={...pkg.dependencies,...pkg.devDependencies};
      kind=d['react-scripts']?'cra':d.vite?'vite':'generic';
      if(!(pkg.scripts&&pkg.scripts.build))warns.push('package.json has no "build" script, so CI cannot build it.');
      if(d['react-router-dom'])warns.push('This app uses react-router. Switch to HashRouter so pages load inside the desktop and mobile shells.');
      if(d.next)warns.push('Next.js apps need output: "export" in their config for this to work.');
    }else if(z.file(pre+'index.html'))kind='static';
    else throw new Error('No package.json or index.html at the top of this zip.');
  }else if(/\.html?$/i.test(n)){
    z=new JSZip();z.file('index.html',await f.text());kind='static';
  }else if(/\.jsx?$/i.test(n)){
    const t=await f.text(),deps={react:'^18.3.1','react-dom':'^18.3.1'};
    for(const m of t.matchAll(/from\s+['"]([^'".\/][^'"]*)['"]/g)){
      const p=m[1].startsWith('@')?m[1].split('/').slice(0,2).join('/'):m[1].split('/')[0];
      if(!deps[p])deps[p]='latest';
    }
    if(!/export\s+default/.test(t))warns.push('No default export found. The scaffold imports App as the default export.');
    pkg={name:slug(base),version:'1.0.0',private:true,type:'module',scripts:{dev:'vite',build:'vite build'},dependencies:deps,devDependencies:{vite:'^5.4.0','@vitejs/plugin-react':'^4.3.0'}};
    z=new JSZip();
    z.file('package.json',JSON.stringify(pkg,null,2));
    z.file('vite.config.js',"import {defineConfig} from 'vite';\nimport react from '@vitejs/plugin-react';\nexport default defineConfig({plugins:[react()],base:'./'});\n");
    z.file('index.html','<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+base+'</title></head><body><div id="root"></div><script type="module" src="/src/main.jsx"><\/script></body></html>');
    z.file('src/main.jsx',"import React from 'react';\nimport {createRoot} from 'react-dom/client';\nimport App from './App.jsx';\ncreateRoot(document.getElementById('root')).render(<App/>);\n");
    z.file('src/App.jsx',t);kind='vite';count=5;
  }else throw new Error('Use a .zip, .html or .jsx file.');
  const next=pkg&&pkg.dependencies&&pkg.dependencies.next;
  return {z,pre,kind,pkg,name:base,count,warns,outDir:kind==='static'?'out':kind==='cra'?'build':next?'out':'dist'};
}

async function iconPng(o,sz){
  const c=document.createElement('canvas');c.width=c.height=sz;
  const x=c.getContext('2d');
  if(o.img){const w=o.img.naturalWidth,hh=o.img.naturalHeight,s=Math.min(w,hh);x.drawImage(o.img,(w-s)/2,(hh-s)/2,s,s,0,0,sz,sz)}
  else{x.fillStyle=o.color;x.fillRect(0,0,sz,sz);x.fillStyle='#fff';x.font='700 '+Math.round(sz*.46)+'px system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText((o.name.trim().slice(0,2)||'A').toUpperCase(),sz/2,sz/2+sz*.03)}
  const b=await new Promise(r=>c.toBlob(r,'image/png'));
  return new Uint8Array(await b.arrayBuffer());
}

function makeWf(kind,sel,outDir){
  const L=[],P=(...a)=>L.push(...a);
  const node=['      - uses: actions/checkout@v4','      - uses: actions/setup-node@v4','        with: { node-version: 20 }'];
  const dl=d=>['      - uses: actions/download-artifact@v4','        with: { name: web, path: '+d+' }'];
  P('name: Package apps','on:','  workflow_dispatch:','  push:','    tags: ["v*"]','jobs:','  web:','    runs-on: ubuntu-latest','    steps:',...node);
  if(kind==='static')P('      - run: mkdir -p out && rsync -a --exclude=out --exclude=.git --exclude=.github --exclude=shell-desktop --exclude=shell-mobile ./ out/');
  else P('      - run: npm ci || npm install','      - run: npm run build'+(kind==='vite'?' -- --base=./':''));
  P('      - uses: actions/upload-artifact@v4','        with: { name: web, path: '+outDir+' }');
  const oss=['win','mac','linux'].filter(k=>sel.includes(k)).map(k=>OS[k]);
  if(oss.length)P('  desktop:','    needs: web','    strategy:','      fail-fast: false','      matrix:','        os: ['+oss.join(', ')+']','    runs-on: ${{ matrix.os }}','    steps:',...node,...dl('shell-desktop/app'),'      - run: npm install && npx electron-builder --publish never','        shell: bash','        working-directory: shell-desktop','        env: { CSC_IDENTITY_AUTO_DISCOVERY: "false" }','      - uses: actions/upload-artifact@v4','        with:','          name: desktop-${{ matrix.os }}','          path: |','            shell-desktop/dist/*.exe','            shell-desktop/dist/*.dmg','            shell-desktop/dist/*.AppImage','            shell-desktop/dist/*.deb');
  if(sel.includes('android'))P('  android:','    needs: web','    runs-on: ubuntu-latest','    steps:',...node,'      - uses: actions/setup-java@v4','        with: { distribution: temurin, java-version: 17 }',...dl('shell-mobile/www'),'      - run: npm install && npx cap add android && npx cap sync android && cd android && ./gradlew assembleDebug','        working-directory: shell-mobile','      - uses: actions/upload-artifact@v4','        with: { name: android-apk, path: shell-mobile/android/app/build/outputs/apk/debug/*.apk }');
  if(sel.includes('ios'))P('  ios:','    needs: web','    runs-on: macos-latest','    steps:',...node,...dl('shell-mobile/www'),'      - run: npm install && npx cap add ios && npx cap sync ios','        working-directory: shell-mobile','      - run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO','        working-directory: shell-mobile','      - uses: actions/upload-artifact@v4','        with: { name: ios-archive, path: shell-mobile/build/App.xcarchive }');
  return L.join('\n')+'\n';
}

async function buildZip(p,o,sel){
  const {z,pre,kind,pkg,outDir}=p,added=[];
  const add=(f,c)=>{z.file(pre+f,c);added.push(f)};
  ['shell-desktop','shell-mobile','.github/workflows/package.yml'].forEach(x=>z.remove(pre+x));
  const sl=slug(o.name),has=k=>sel.includes(k);
  const desk=['win','mac','linux'].some(has),mob=has('android')||has('ios');
  const big=await iconPng(o,1024);
  if(has('pwa')){
    const pd=['vite','cra','generic'].includes(kind)?'public/':'';
    const pu=kind==='cra'?'%PUBLIC_URL%/':pd?'/':'./';
    const hp=kind==='cra'?'public/index.html':'index.html';
    add(pd+'manifest.webmanifest',JSON.stringify({name:o.name,short_name:o.name.slice(0,12),start_url:'./',scope:'./',display:'standalone',background_color:o.color,theme_color:o.color,icons:[{src:'icon-192.png',sizes:'192x192',type:'image/png'},{src:'icon-512.png',sizes:'512x512',type:'image/png',purpose:'any maskable'}]},null,2));
    add(pd+'sw.js',SW);
    add(pd+'icon-192.png',await iconPng(o,192));
    add(pd+'icon-512.png',await iconPng(o,512));
    const f=z.file(pre+hp);
    if(f){
      let t=await f.async('string');
      if(!/rel=["']manifest/.test(t)){
        t=t.replace(/<\/head>/i,'<link rel="manifest" href="'+pu+'manifest.webmanifest"><meta name="theme-color" content="'+o.color+'"><link rel="apple-touch-icon" href="'+pu+'icon-192.png"></head>')
           .replace(/<\/body>/i,'<script>if("serviceWorker" in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("./sw.js")<\/script></body>');
        add(hp,t);
      }
    }
  }
  if(kind==='cra'&&pkg){pkg.homepage='.';add('package.json',JSON.stringify(pkg,null,2))}
  if(desk){
    add('shell-desktop/main.js',MAIN);
    add('shell-desktop/build/icon.png',big);
    add('shell-desktop/package.json',JSON.stringify({name:sl,productName:o.name,version:o.ver,description:o.name,main:'main.js',author:{name:o.author,email:'noreply@example.com'},homepage:'https://github.com',license:'MIT',devDependencies:{electron:'^33.2.0','electron-builder':'^25.1.8'},build:{appId:o.id,productName:o.name,directories:{output:'dist',buildResources:'build'},files:['main.js','app/**'],win:{target:['nsis']},mac:{target:['dmg'],category:'public.app-category.productivity'},linux:{target:['AppImage','deb'],category:'Utility'}}},null,2));
  }
  if(mob){
    add('shell-mobile/package.json',JSON.stringify({name:sl+'-mobile',version:o.ver,private:true,dependencies:{'@capacitor/core':'^6.2.0','@capacitor/android':'^6.2.0','@capacitor/ios':'^6.2.0'},devDependencies:{'@capacitor/cli':'^6.2.0'}},null,2));
    add('shell-mobile/capacitor.config.json',JSON.stringify({appId:o.id,appName:o.name,webDir:'www'},null,2));
  }
  const wf=(desk||mob)?makeWf(kind,sel,outDir):'';
  if(wf)add('.github/workflows/package.yml',wf);
  add('PACKAGING.md','# Packaging '+o.name+'\n\n1. Commit this folder to a GitHub repo.\n2. Open Actions, choose "Package apps", then Run workflow. Pushing a tag like v1.0.0 also runs it.\n3. When the run finishes, download installers from its Artifacts section.\n\nDesktop installers are unsigned. Windows SmartScreen and macOS Gatekeeper will warn until you add signing certificates.\nAndroid builds a debug APK you can sideload. iOS produces an unsigned archive; running it on a device or TestFlight needs an Apple Developer account.\n');
  const blob=await z.generateAsync({type:'blob',compression:'DEFLATE'});
  return {blob,wf,added};
}

function App(){
  const[p,setP]=useState(null),[o,setO]=useState(null),[sel,setSel]=useState(['pwa','win','mac','linux','android']);
  const[err,setErr]=useState(''),[busy,setBusy]=useState(false),[res,setRes]=useState(null),[over,setOver]=useState(false),[note,setNote]=useState('');
  const up=(k,v)=>{setO({...o,[k]:v});setRes(null)};
  async function pick(f){
    if(!f)return;setErr('');setRes(null);setNote('');setBusy(true);
    try{
      const r=await readProject(f);
      setP(r);
      setO({name:r.name,id:'com.phi369.'+slug(r.name).replace(/-/g,'').replace(/^(\d)/,'app$1'),ver:semver(r.pkg&&r.pkg.version)?r.pkg.version:'1.0.0',author:'PHI369 Labs',color:'#0a6f6a',img:null});
    }catch(e){setErr(e.message||String(e))}
    setBusy(false);
  }
  function pickImg(f){if(!f)return;const i=new Image();i.onload=()=>up('img',i);i.src=URL.createObjectURL(f)}
  async function go(){
    setBusy(true);setErr('');setNote('');
    try{setRes(await buildZip(p,o,sel))}catch(e){setErr('Packaging failed: '+(e.message||e))}
    setBusy(false);
  }
  async function save(){
    if(!res?.blob)return;
    try{
      const url=URL.createObjectURL(res.blob);
      const el=document.createElement('a');
      el.href=url;el.download=slug(o.name)+'-packaged.zip';
      document.body.appendChild(el);el.click();el.remove();
      window.setTimeout(()=>URL.revokeObjectURL(url),15000);
      setNote('Download requested; review generated workflows before running them.');
    }catch(e){setNote('Download failed: '+(e?.message||String(e)))}
  }
  const field=(label,k,extra)=>h('label',{className:'f'},label,h('input',{className:'in',value:o[k],onChange:e=>up(k,e.target.value),...extra}));
  return h('main',{className:'wrap'},
    h('h1',null,'THE DROP ZONE'),
    h('p',{className:'note'},'EARLY BROWSER PREVIEW · Claude-based packager. The tri-AI v0.3 React app is the upcoming upgrade.'),
    h('p',{className:'sub'},'Source in. Build kit out. Drop a project ZIP, HTML file, or React script to generate packaging workflows.'),
    h('label',{className:'drop'+(over?' on':''),onDragOver:e=>{e.preventDefault();setOver(true)},onDragLeave:()=>setOver(false),onDrop:e=>{e.preventDefault();setOver(false);pick(e.dataTransfer.files[0])}},
      h('input',{type:'file',className:'sr',accept:'.zip,.html,.htm,.jsx,.js',onChange:e=>{pick(e.target.files[0]);e.target.value=''}}),
      h('strong',null,p?'Drop another project to replace this one':'Drop a .zip, .html or .jsx here'),
      h('span',null,'or click to choose. Files stay in your browser.')),
    err&&h('p',{className:'err',role:'alert'},err),
    p&&o&&h('section',{className:'card'},
      h('h2',null,p.name),
      h('p',{className:'meta'},KIND[p.kind]+', '+p.count+' files'),
      p.warns.map(w=>h('p',{className:'warn',key:w},w)),
      h('div',{className:'grid'},
        field('App name','name'),field('App ID','id'),field('Version','ver'),field('Author','author'),
        h('label',{className:'f'},'Icon color',h('input',{type:'color',className:'in',value:o.color,onChange:e=>up('color',e.target.value)})),
        h('label',{className:'f'},'Icon image (optional, square works best)',h('input',{type:'file',className:'in',accept:'image/*',onChange:e=>pickImg(e.target.files[0])}))),
      h('fieldset',null,h('legend',null,'Build for'),
        h('div',{className:'chips'},TG.map(([k,t,s])=>h('label',{key:k,className:'chip'+(sel.includes(k)?' on':'')},
          h('input',{type:'checkbox',className:'sr',checked:sel.includes(k),onChange:()=>{setSel(sel.includes(k)?sel.filter(x=>x!==k):[...sel,k]);setRes(null)}}),
          h('b',null,t),h('small',null,s))))),
      sel.includes('ios')&&h('p',{className:'note'},'iOS builds an unsigned archive. To install on a device or ship through TestFlight you need an Apple Developer account and signing certificates.'),
      h('button',{className:'go',disabled:busy||!sel.length,onClick:go},busy?'Working...':'Package project')),
    res&&h('section',{className:'card'},
      h('h2',null,'Ready'),
      h('p',{className:'meta'},'Added to your project:'),
      h('pre',null,res.added.join('\n')),
      h('button',{className:'go',onClick:save},'Save '+slug(o.name)+'-packaged.zip'),
      note&&h('p',{className:'note',role:'status'},note),
      res.wf&&h(React.Fragment,null,
        h('p',{className:'meta',style:{marginTop:18}},'To get the installers:'),
        h('ol',null,
          h('li',null,'Unzip and push the folder to a GitHub repo.'),
          h('li',null,'Open Actions, pick "Package apps" and press Run workflow.'),
          h('li',null,'Download the Windows, Mac, Linux and Android files from the run\'s Artifacts.')),
        h('p',{className:'note'},'Desktop apps use Electron. Android and iOS use Capacitor. The PWA works as soon as the site is hosted, for example on GitHub Pages.'),
        h('details',null,h('summary',null,'View generated workflow'),h('pre',null,res.wf)))));
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script></body></html>
